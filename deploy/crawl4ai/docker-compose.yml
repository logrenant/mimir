
services:
  crawl4ai:
    image: unclecode/crawl4ai:0.8.9
    ports:
      - "127.0.0.1:11235:11235"
    volumes:
      - ./.data:/root/.crawl4ai
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11235/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
